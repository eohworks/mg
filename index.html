<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://use.typekit.net/pdy4ucr.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/type.css">
  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>
  <header class="site-header">
    <img class="site-header__icon site-header__icon--menu" src="assets/menu-icon.svg" alt="Menu">
    <img class="site-header__logo" id="wordmark" src="assets/logo.svg" alt="" data-wordmark="gothic-v1">
    <img class="site-header__icon" src="assets/bag-icon.svg" alt="">
  </header>
  <section class="hero">
    <div class="hero__image">
      <img src="assets/hexagon-bottle.png" alt="">
    </div>
    <div class="hero__image">
      <img src="assets/chair.png" alt="">
    </div>
    <img class="hero__wheel" id="wheel" src="assets/wheel-icon.svg" alt="" data-wheel="flame">
    <nav class="menu" id="menu" hidden>
      <div class="menu__section">
        <p class="menu__heading">WORDMARK</p>
        <div class="menu__group">
          <p class="menu__group-label">GOTHIC</p>
          <button class="menu__row menu__row--active" type="button" data-wordmark-option="gothic-v1" data-asset="assets/logo.svg"><span class="menu__row-label">v. 1<img class="menu__row-view" src="assets/view-icon.svg" alt=""></span><img src="assets/arrow-right.svg" alt=""></button>
          <button class="menu__row" type="button" data-wordmark-option="gothic-v2">v. 2<img src="assets/arrow-right.svg" alt=""></button>
        </div>
        <div class="menu__group">
          <p class="menu__group-label">MODERN</p>
          <button class="menu__row" type="button" data-wordmark-option="modern-v1">v. 1<img src="assets/arrow-right.svg" alt=""></button>
          <button class="menu__row" type="button" data-wordmark-option="modern-v2">v. 2<img src="assets/arrow-right.svg" alt=""></button>
        </div>
        <div class="menu__group">
          <p class="menu__group-label">CLASSIC</p>
          <button class="menu__row" type="button" data-wordmark-option="classic-v1">v. 1<img src="assets/arrow-right.svg" alt=""></button>
          <button class="menu__row" type="button" data-wordmark-option="classic-v2">v. 2<img src="assets/arrow-right.svg" alt=""></button>
        </div>
      </div>
      <div class="menu__section">
        <p class="menu__heading">WHEEL</p>
        <div class="menu__group">
          <button class="menu__row menu__row--active" type="button" data-wheel-option="flame" data-asset="assets/wheel-icon.svg"><span class="menu__row-label">Flame<img class="menu__row-view" src="assets/view-icon.svg" alt=""></span><img src="assets/arrow-right.svg" alt=""></button>
          <button class="menu__row" type="button" data-wheel-option="weave">Weave<img src="assets/arrow-right.svg" alt=""></button>
        </div>
      </div>
    </nav>
  </section>
  <script src="js/wheel-spin.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
