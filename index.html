<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://use.typekit.net/pdy4ucr.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/type.css">
  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>
  <header class="site-header">
    <img class="site-header__icon site-header__icon--menu" src="assets/menu-icon.svg" alt="Menu">
    <img class="site-header__logo" src="assets/logo.svg" alt="">
    <img class="site-header__icon" src="assets/bag-icon.svg" alt="">
  </header>
  <section class="hero">
    <div class="hero__image">
      <img src="assets/hexagon-bottle.png" alt="">
    </div>
    <div class="hero__image">
      <img src="assets/chair.png" alt="">
    </div>
    <img class="hero__wheel" src="assets/wheel-icon.svg" alt="">
    <nav class="menu" id="menu" hidden>
      <div class="menu__section">
        <p class="menu__heading">WORDMARK</p>
        <div class="menu__group">
          <p class="menu__group-label">GOTHIC</p>
          <button class="menu__row" type="button">v. 1<img src="assets/arrow-right.svg" alt=""></button>
          <button class="menu__row" type="button">v. 2<img src="assets/arrow-right.svg" alt=""></button>
        </div>
        <div class="menu__group">
          <p class="menu__group-label">MODERN</p>
          <button class="menu__row" type="button">v. 1<img src="assets/arrow-right.svg" alt=""></button>
          <button class="menu__row" type="button">v. 2<img src="assets/arrow-right.svg" alt=""></button>
        </div>
        <div class="menu__group">
          <p class="menu__group-label">CLASSIC</p>
          <button class="menu__row" type="button">v. 1<img src="assets/arrow-right.svg" alt=""></button>
          <button class="menu__row" type="button">v. 2<img src="assets/arrow-right.svg" alt=""></button>
        </div>
      </div>
      <div class="menu__section">
        <p class="menu__heading">WHEEL</p>
        <div class="menu__group">
          <button class="menu__row" type="button">Flame<img src="assets/arrow-right.svg" alt=""></button>
          <button class="menu__row" type="button">Weave<img src="assets/arrow-right.svg" alt=""></button>
        </div>
      </div>
    </nav>
  </section>
  <script src="js/wheel-spin.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
